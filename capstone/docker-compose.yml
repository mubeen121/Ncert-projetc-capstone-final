# docker-compose.yml — runs the full Sentiment Analysis Dashboard system
# Usage: docker compose up --build
version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentiment-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentiment-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
