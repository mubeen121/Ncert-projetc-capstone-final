<!DOCTYPE html>
<!--
  index.html — Sentiment Analysis Dashboard (Frontend)
  Part C: Frontend/UI Development & Integration

  This page is a Single Page App that connects directly to the Backend API (FastAPI) via fetch()
  No build tool is required, keeping deployment simple (e.g. GitHub Pages, Netlify, or
  serving it as a static file from FastAPI/Nginx also works)
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentiment Analysis Dashboard</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #171d26;
    --border: #2a3341;
    --text: #e8edf2;
    --muted: #8a97a8;
    --positive: #35d399;
    --negative: #ff6b6b;
    --neutral: #ffd166;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Noto Sans Thai', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 28px 32px 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  textarea {
    width: 100%;
    min-height: 100px;
    background: #0f1419;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 12px;
    font-size: 15px;
    resize: vertical;
    font-family: inherit;
  }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-ok { background: var(--positive); }
  .status-bad { background: var(--negative); }
  #apiStatus { font-size: 13px; color: var(--muted); }
  .result { margin-top: 18px; }
  .label-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
  }
  .label-positive { background: rgba(53,211,153,0.15); color: var(--positive); }
  .label-negative { background: rgba(255,107,107,0.15); color: var(--negative); }
  .label-neutral { background: rgba(255,209,102,0.15); color: var(--neutral); }
  .bars { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .bar-label { width: 70px; color: var(--muted); }
  .bar-track { flex: 1; background: #0f1419; border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
  .fill-positive { background: var(--positive); }
  .fill-negative { background: var(--negative); }
  .fill-neutral { background: var(--neutral); }
  .bar-pct { width: 46px; text-align: right; color: var(--muted); }
  .meta { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .error-box { background: rgba(255,107,107,0.1); border: 1px solid var(--negative); color: var(--negative); padding: 12px; border-radius: 8px; margin-top: 14px; font-size: 14px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .history-item:last-child { border-bottom: none; }
  .history-text { color: var(--muted); max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 8px; }
  .metric-box { background: #0f1419; border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .metric-value { font-size: 22px; font-weight: 700; color: var(--accent); }
  .metric-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .config-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  input[type=text].api-input {
    flex: 1; background: #0f1419; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 8px 10px; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>📊 Sentiment Analysis Dashboard</h1>
  <p>Analyze the sentiment of review text (Positive / Negative / Neutral) — PKCERT Capstone Task 28</p>
</header>

<main>
  <div class="card">
    <div class="config-row">
      <label for="apiUrl" style="font-size:13px; color: var(--muted); white-space:nowrap;">Backend API URL:</label>
      <input type="text" id="apiUrl" class="api-input" value="http://127.0.0.1:8000" />
      <span id="apiStatus"><span class="status-dot status-bad"></span>checking...</span>
    </div>

    <textarea id="inputText" placeholder="Type a review or comment you want to analyze the sentiment of... (Thai/English)"></textarea>
    <div class="row">
      <button id="analyzeBtn" onclick="analyzeSentiment()">Analyze Sentiment</button>
      <button class="secondary" onclick="clearInput()">Clear Text</button>
      <span id="loadingLabel" style="display:none; color: var(--muted); font-size:13px;">Analyzing...</span>
    </div>

    <div id="errorBox" class="error-box" style="display:none;"></div>

    <div id="resultBox" class="result" style="display:none;">
      <span id="labelBadge" class="label-badge"></span>
      <div class="bars" id="barsContainer"></div>
      <div class="meta" id="metaInfo"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Recent Analysis History</h3>
    <div id="historyList" style="color: var(--muted); font-size: 13px;">No history yet</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Model Performance (Test Set)</h3>
    <div id="metricsGrid" class="metrics-grid">
      <div class="metric-box"><div class="metric-value">—</div><div class="metric-label">Accuracy</div></div>
    </div>
  </div>
</main>

<script>
const history = [];

function getApiUrl() {
  return document.getElementById('apiUrl').value.replace(/\/$/, '');
}

async function checkHealth() {
  const statusEl = document.getElementById('apiStatus');
  try {
    const res = await fetch(getApiUrl() + '/api/health');
    const data = await res.json();
    if (data.status === 'ok' && data.model_loaded) {
      statusEl.innerHTML = '<span class="status-dot status-ok"></span>Connected (model ready)';
    } else {
      statusEl.innerHTML = '<span class="status-dot status-bad"></span>Connected, but the model is not ready';
    }
    loadMetrics();
  } catch (e) {
    statusEl.innerHTML = '<span class="status-dot status-bad"></span>Could not connect to the backend';
  }
}

async function loadMetrics() {
  try {
    const res = await fetch(getApiUrl() + '/api/metrics');
    if (!res.ok) return;
    const data = await res.json();
    const m = data.final_test_metrics;
    document.getElementById('metricsGrid').innerHTML = `
      <div class="metric-box"><div class="metric-value">${(m.accuracy*100).toFixed(1)}%</div><div class="metric-label">Accuracy</div></div>
      <div class="metric-box"><div class="metric-value">${(m.precision_macro*100).toFixed(1)}%</div><div class="metric-label">Precision (macro)</div></div>
      <div class="metric-box"><div class="metric-value">${(m.recall_macro*100).toFixed(1)}%</div><div class="metric-label">Recall (macro)</div></div>
      <div class="metric-box"><div class="metric-value">${(m.f1_macro*100).toFixed(1)}%</div><div class="metric-label">F1 (macro)</div></div>
    `;
  } catch (e) { /* ignore */ }
}

function clearInput() {
  document.getElementById('inputText').value = '';
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('errorBox').style.display = 'none';
}

async function analyzeSentiment() {
  const text = document.getElementById('inputText').value.trim();
  const errorBox = document.getElementById('errorBox');
  const resultBox = document.getElementById('resultBox');
  const btn = document.getElementById('analyzeBtn');
  const loadingLabel = document.getElementById('loadingLabel');

  errorBox.style.display = 'none';
  resultBox.style.display = 'none';

  if (!text) {
    errorBox.textContent = 'Please enter some text before analyzing';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  loadingLabel.style.display = 'inline';

  try {
    const res = await fetch(getApiUrl() + '/api/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || 'An unknown error occurred');
    }

    renderResult(data);
    history.unshift(data);
    renderHistory();
  } catch (e) {
    errorBox.textContent = 'Error: ' + e.message;
    errorBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    loadingLabel.style.display = 'none';
  }
}

function renderResult(data) {
  const badge = document.getElementById('labelBadge');
  const labelText = { positive: 'Positive', negative: 'Negative', neutral: 'Neutral' };
  badge.textContent = labelText[data.label] || data.label;
  badge.className = 'label-badge label-' + data.label;

  const barsContainer = document.getElementById('barsContainer');
  barsContainer.innerHTML = '';
  const order = ['positive', 'neutral', 'negative'];
  order.forEach(label => {
    const pct = (data.probabilities[label] || 0) * 100;
    barsContainer.innerHTML += `
      <div class="bar-row">
        <div class="bar-label">${label}</div>
        <div class="bar-track"><div class="bar-fill fill-${label}" style="width:${pct}%"></div></div>
        <div class="bar-pct">${pct.toFixed(1)}%</div>
      </div>`;
  });

  document.getElementById('metaInfo').textContent =
    `Confidence: ${(data.confidence*100).toFixed(1)}%  •  Latency: ${data.latency_ms} ms`;
  document.getElementById('resultBox').style.display = 'block';
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (history.length === 0) { el.textContent = 'No history yet'; return; }
  el.innerHTML = history.slice(0, 8).map(h => `
    <div class="history-item">
      <span class="history-text">${escapeHtml(h.text)}</span>
      <span class="label-badge label-${h.label}" style="padding:3px 10px; font-size:11px;">${h.label}</span>
    </div>`).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('inputText').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.ctrlKey) analyzeSentiment();
});

checkHealth();
</script>
</body>
</html>
